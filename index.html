<!DOCTYPE html>
<!--
  LES DÉFIS DE SHAMS — entraînement scolaire CM2
  =================================================
  COMMENT OUVRIR CE FICHIER :
  Double-clique simplement sur "index.html" : il s'ouvre dans ton navigateur
  habituel (Chrome, Safari, Firefox, Edge...). Aucune connexion internet
  n'est nécessaire, aucune installation, rien n'est envoyé en ligne.
  Tu peux aussi le copier sur une tablette ou un téléphone : ça fonctionne
  pareil, en double-cliquant ou en l'ouvrant depuis l'application Fichiers.

  COMMENT RÉINITIALISER LA PROGRESSION :
  Va dans l'onglet "Réglages" (en haut de l'application), puis clique sur le
  bouton rouge-orangé "Réinitialiser ma progression". Une confirmation te
  sera demandée avant d'effacer les scores, séries et badges. Tu peux aussi
  supprimer manuellement la clé "shamsProgress_v1" dans le localStorage du
  navigateur si tu préfères le faire depuis les outils de développement.

  Tout est stocké uniquement sur cet appareil (localStorage). Il n'y a ni
  serveur, ni tracker, ni bibliothèque externe : un seul fichier autonome.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>Les défis de Shams</title>
<style>
  :root{
    --fs-body: 18px;
    --fs-exercise: 23px;
    --fs-title: 26px;
    --radius: 18px;
    --bg: #f4f7ff;
    --bg-warm: #fff8ef;
    --card: #ffffff;
    --ink: #1f2430;
    --ink-soft: #4a5169;
    --primary: #3d5cff;
    --primary-dark: #2b41c9;
    --accent: #ff9f43;
    --good: #2fb380;
    --good-bg: #e5f8ef;
    --warn: #e08a1e;
    --warn-bg: #fff2df;
    --fragile: #e08a1e;
    --presque: #3d5cff;
    --acquis: #2fb380;
    --nouveau: #8a90a6;
    --shadow: 0 6px 18px rgba(40,50,90,0.10);
    --focus: 3px solid #1749ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: var(--fs-body);
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-warm) 100%);
    min-height: 100vh;
    line-height: 1.5;
  }
  #app{ max-width: 720px; margin: 0 auto; padding: 12px 16px 60px; }
  button{ font-family: inherit; cursor: pointer; }
  a{ color: var(--primary-dark); }
  h1,h2,h3{ line-height:1.25; margin: 0 0 8px; }
  .visually-hidden{
    position:absolute; width:1px;height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: var(--focus); outline-offset: 2px;
  }

  /* --- Top nav --- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; padding: 14px 4px 10px; position:sticky; top:0;
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-warm) 100%);
    z-index: 10;
  }
  .brand{ font-weight:800; font-size:20px; display:flex; align-items:center; gap:8px; }
  .navbtns{ display:flex; gap:6px; }
  .navbtns button{
    border:none; background: rgba(61,92,255,0.08); color: var(--ink);
    padding: 10px 12px; border-radius: 12px; font-size:15px; font-weight:600;
    min-height:44px;
  }
  .navbtns button[aria-current="true"]{ background: var(--primary); color:#fff; }

  /* --- Cards --- */
  .card{
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px;
  }
  .hello{ font-size: 22px; font-weight:800; margin-bottom:4px; }
  .hello-sub{ color: var(--ink-soft); font-size: 16px; }

  .challenge-card{
    background: linear-gradient(120deg, #eef2ff, #fff7e9);
    border: 2px solid #dfe6ff;
  }
  .challenge-title{ font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--primary-dark); font-weight:800; margin-bottom:6px;}
  .challenge-mod{ font-size:20px; font-weight:800; margin-bottom:10px; }

  /* --- Module grid --- */
  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
    gap: 12px;
  }
  .mod-card{
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 14px; text-align:left; border: none; display:flex; flex-direction:column;
    gap:8px; min-height: 128px;
  }
  .mod-emoji{ font-size: 30px; }
  .mod-title{ font-weight:700; font-size:16px; }
  .pastille{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
    padding: 4px 10px; border-radius: 999px; width: fit-content;
  }
  .pastille.fragile{ background: var(--warn-bg); color: var(--fragile); }
  .pastille.presque{ background: #e8ecff; color: var(--presque); }
  .pastille.acquis{ background: var(--good-bg); color: var(--acquis); }
  .pastille.nouveau{ background: #eceef4; color: var(--nouveau); }

  /* --- Buttons --- */
  .btn{
    border:none; border-radius: 14px; padding: 14px 18px; font-weight:700;
    font-size: 17px; min-height: 48px; min-width: 48px;
  }
  .btn-primary{ background: var(--primary); color:#fff; }
  .btn-primary:hover{ background: var(--primary-dark); }
  .btn-ghost{ background: #eef1fb; color: var(--ink); }
  .btn-danger{ background: #fdeee3; color:#b5540e; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-block{ width:100%; }

  /* --- Rule reminder --- */
  .rule-box{
    background: #eef2ff; border-radius: 14px; padding:16px; font-size: 18px;
    color: var(--ink); margin: 12px 0 4px; border-left: 6px solid var(--primary);
  }
  .rule-example{
    margin-top:10px; padding-top:10px; border-top:2px dashed #c7d0f0; font-size:17px;
  }

  /* --- Illustrations des solides --- */
  .solid-fig{
    display:flex; justify-content:center; margin: 4px 0 10px;
  }
  .solid-fig svg{ width: 150px; height: 128px; }

  /* --- Opérations posées --- */
  .posed-op{ display:flex; justify-content:center; margin: 4px 0 14px; }
  .posed-mult{ font-family:"Courier New",monospace; font-size:28px; font-weight:800; text-align:right; color:var(--ink); }
  .posed-mult .pline{ padding:2px 4px; }
  .posed-mult .op-line{ border-top:3px solid var(--primary-dark); margin-top:2px; }
  .posed-div{ display:flex; align-items:flex-start; gap:0; font-family:"Courier New",monospace; font-size:28px; font-weight:800; color:var(--ink); }
  .posed-div .dividende{ padding:4px 10px 4px 4px; }
  .posed-div .potence{ border-left:3px solid var(--primary-dark); padding-left:10px; }
  .posed-div .diviseur{ border-bottom:3px solid var(--primary-dark); padding:4px 8px 6px 2px; display:inline-block; }

  /* --- Quiz --- */
  .progressbar-track{
    height: 10px; background:#e7ebf7; border-radius:999px; overflow:hidden; margin-bottom:14px;
  }
  .progressbar-fill{ height:100%; background: var(--primary); transition: width .3s ease; }
  .qcounter{ font-size:14px; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
  .prompt{ font-size: var(--fs-exercise); font-weight:700; margin: 6px 0 14px; }
  .sub-prompt{ font-size:16px; color:var(--ink-soft); margin-bottom:10px; }
  .answer-input{
    font-size: var(--fs-exercise); padding: 12px 14px; border-radius:12px;
    border: 2px solid #ccd3ee; width: 100%; background:#fff; color:var(--ink);
  }
  .answer-input:focus{ border-color: var(--primary); }
  .frame-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size: var(--fs-exercise); font-weight:700;}
  .frame-row input.answer-input{ width: 110px; text-align:center; }
  .two-inputs{ display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .two-inputs > div{ flex:1; min-width:140px; }
  .two-inputs label{ display:block; font-size:15px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);}
  .choices{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .choice-btn{
    background:#eef1fb; border:2px solid transparent; border-radius:14px;
    padding: 14px 18px; font-size:18px; font-weight:700; min-height:52px; flex:1; min-width:130px;
  }
  .choice-btn[aria-pressed="true"]{ border-color: var(--primary); background:#dde4ff; }
  .rank-pool{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .rank-chip{
    background:#eef1fb; border:2px solid transparent; border-radius:12px;
    padding:10px 14px; font-size:18px; font-weight:700; min-height:48px;
  }
  .rank-chip[disabled]{ opacity:.35; }
  .rank-selected{
    display:flex; gap:8px; flex-wrap:wrap; margin: 10px 0; min-height:44px;
    padding: 8px; border: 2px dashed #ccd3ee; border-radius:12px;
  }
  .rank-selected span{ background: var(--primary); color:#fff; padding:8px 12px; border-radius:10px; font-weight:700; }

  .feedback{
    margin-top:14px; padding:14px 16px; border-radius:14px; font-size:18px; font-weight:700;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background: var(--good-bg); color: #1d7a54; }
  .feedback.retry{ background: var(--warn-bg); color: #9a5b0d; }
  .feedback.reveal{ background:#eef1fb; color:var(--primary-dark); }
  .tip{ font-size:15px; margin-top:6px; color:var(--ink-soft); font-weight:500; }
  .euler-btn{ margin-top:10px; background:#fff; border:2px solid var(--primary); color:var(--primary-dark); border-radius:12px; padding:8px 12px; font-weight:700; font-size:14px; }
  .euler-info{ margin-top:8px; font-size:15px; background:#fff; border-radius:10px; padding:10px; }

  /* --- Result screen --- */
  .result-score{ font-size:44px; font-weight:800; text-align:center; margin: 6px 0; color:var(--primary-dark); }
  .result-stars{ text-align:center; font-size:30px; margin-bottom:8px; }
  .result-line{ text-align:center; color:var(--ink-soft); font-size:16px; }
  .badge-banner{
    background: linear-gradient(120deg,#fff2df,#ffe8f0); border-radius:14px; padding:14px;
    text-align:center; font-weight:700; margin-top:14px; color:#8a4b12;
  }

  /* --- Progress table --- */
  table.suivi{ width:100%; border-collapse: collapse; }
  table.suivi td, table.suivi th{ padding:10px 6px; text-align:left; font-size:15px; }
  table.suivi th{ color: var(--ink-soft); font-size:13px; text-transform:uppercase; letter-spacing:.04em; border-bottom:2px solid #e7ebf7; }
  table.suivi tr + tr td{ border-top: 1px solid #eef0f8; }
  .mini-bar-track{ background:#e7ebf7; border-radius:999px; height:8px; width:100%; overflow:hidden; }
  .mini-bar-fill{ height:100%; background: var(--primary); }
  .streak-banner{
    text-align:center; font-size:20px; font-weight:800; background:#fff2df; color:#8a4b12;
    border-radius:14px; padding:14px; margin-bottom:16px;
  }

  /* --- Settings --- */
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; }
  .switch{ position:relative; width:56px; height:32px; }
  .switch input{ opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch .track{
    position:absolute; inset:0; background:#ccd3ee; border-radius:999px; transition:.2s; pointer-events:none;
  }
  .switch .thumb{
    position:absolute; top:3px; left:3px; width:26px; height:26px; background:#fff; border-radius:50%;
    transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); pointer-events:none;
  }
  .switch input:checked + .track{ background: var(--good); }
  .switch input:checked + .track + .thumb{ transform: translateX(24px); }
  .switch input:focus-visible + .track{ outline: var(--focus); outline-offset:2px; }

  /* --- Confetti --- */
  #confetti-layer{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999; }
  .confetti-piece{
    position:absolute; top:-12px; width:10px; height:14px; border-radius:2px; opacity:.9;
    animation-name: confettiFall; animation-timing-function: ease-in; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    to{ transform: translateY(105vh) rotate(340deg); opacity:0.6; }
  }

  @media (max-width:420px){
    :root{ --fs-exercise: 21px; }
    .grid{ grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); }
  }
</style>
</head>
<body>
<div id="confetti-layer" aria-hidden="true"></div>
<div id="app" role="main"></div>

<script>
(function(){
"use strict";

/* =========================================================
   DONNÉES — contenu validé uniquement (voir consigne projet)
   ========================================================= */

var MODULES = [
  { id:"m1", emoji:"⏳", title:"Passé simple : les terminaisons",
    ruleTitle:"La machine à voyager dans le temps",
    ruleHtml:"Verbes en <b>-ER</b> : -ai, -as, -a, -âmes, -âtes, -èrent.<br>Verbes comme <b>finir</b> : -is, -is, -it, -îmes, -îtes, -irent.<br>Astuce : le petit chapeau (^) ne se pose que sur <b>nous</b> et <b>vous</b> !"+

      '<div class="rule-example">💡 Exemple : <b>venir</b> → <b style="color:var(--good)">il vint</b> / <b style="color:var(--good)">ils vinrent</b></div>' },
  { id:"m3", emoji:"🏠", title:"Encadrer un décimal",
    ruleTitle:"Les deux maisons",
    ruleHtml:"Un nombre décimal habite toujours entre deux nombres entiers, comme une maison entre deux voisins.<br>La partie après la virgule ne compte pas pour trouver les voisins !"+
      '<div class="rule-example">💡 Exemple : <b>6,9</b> habite entre <b style="color:var(--good)">6</b> et <b style="color:var(--good)">7</b> → 6 &lt; 6,9 &lt; 7</div>' },
  { id:"m4", emoji:"👻", title:"Comparer des décimaux",
    ruleTitle:"Le zéro fantôme",
    ruleHtml:"Compare d'abord les entiers, puis les dixièmes, puis les centièmes.<br>Ajouter un zéro après la virgule ne change rien : <b>7,7 = 7,70</b> !"+
      '<div class="rule-example">💡 Exemple : <b>5,78</b> <span style="color:var(--good);font-weight:800;">&lt;</span> <b>5,87</b> car les dixièmes 7 &lt; 8</div>' },
  { id:"m5", emoji:"🌳", title:"Aire et périmètre",
    ruleTitle:"La clôture et le gazon",
    ruleHtml:"Le <b>périmètre</b>, c'est le tour du jardin (la clôture) : unité simple (cm, m...).<br>L'<b>aire</b>, c'est la surface (le gazon) : unité <b>au carré</b> (cm², m²...)."+
      '<div class="rule-example">💡 Exemple : carré de 9 hm de côté → Périmètre = <b style="color:var(--primary-dark)">36 hm</b>, Aire = <b style="color:var(--good)">81 hm²</b></div>' },
  { id:"m6", emoji:"🧩", title:"Phrase simple ou complexe",

    ruleHtml:"1 verbe conjugué = phrase <b>simple</b>. 2 verbes ou + = <b>complexe</b>.<br>Reliés par et/ou/mais/car/donc → <b>coordonnée</b>. Séparés par une virgule → <b>juxtaposée</b>."+
      '<div class="rule-example">💡 Exemple : « Il pleut, les enfants rentrent. » → 2 verbes, virgule → <b style="color:var(--good)">complexe, juxtaposée</b></div>' },
  { id:"m7", emoji:"🎲", title:"Les solides",
    ruleTitle:"Est-ce que ça roule ?",
    ruleHtml:"Un <b>polyèdre</b> n'a que des faces plates : il ne roule pas.<br>S'il a une face courbe (comme une boule) : ce n'est <b>pas un polyèdre</b>, il peut rouler !"+

    ruleTitle:"La dizaine de millions voisine",
    ruleHtml:"Regarde le chiffre des <b>dizaines de millions</b> et trouve les deux dizaines de millions voisines qui encadrent le nombre."+
      '<div class="rule-example">💡 Exemple : <b>123 654 897</b> → 120 000 000 &lt; ... &lt; <b style="color:var(--good)">130 000 000</b></div>' },
  { id:"m9", emoji:"🦋", title:"Axes de symétrie",
    ruleTitle:"Le pliage parfait",
    ruleHtml:"Un axe de symétrie, c'est une ligne qui coupe une figure en deux parties identiques : si on plie dessus, elles se superposent parfaitement !<br>Certaines figures en ont plusieurs, d'autres aucune."+
      '<div class="rule-example">💡 Exemple : un <b>carré</b> a <b style="color:var(--good)">4</b> axes de symétrie, un <b>cercle</b> en a une infinité !</div>' },
  { id:"m10", emoji:"📏", title:"Conversions d'unités",
    ruleTitle:"Grande unité, petite unité",
    ruleHtml:"1 km = 1000 m, 1 m = 100 cm. 1 kg = 1000 g. 1 L = 1000 mL.<br>Pour passer d'une grande unité à une petite, on <b>multiplie</b>. Pour passer d'une petite à une grande, on <b>divise</b> !"+
      '<div class="rule-example">💡 Exemple : 3 km = 3 <span style="color:var(--good);font-weight:800;">×</span> 1000 = <b style="color:var(--good)">3000</b> m</div>' },
  { id:"m11", emoji:"🍕", title:"Fraction d'une quantité",
    ruleTitle:"Partager en parts égales",
    ruleHtml:"Pour prendre une fraction d'une quantité, on partage d'abord en parts égales (le dénominateur), puis on garde le bon nombre de parts (le numérateur)."+

      '<div class="rule-example">💡 Exemple : <b>4,5 × 3</b> = <b style="color:var(--good)">13,5</b> (comme 45 × 3 = 135, puis on replace la virgule)</div>' },

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---- Module 1 : terminaisons passé simple ---- */
function buildM1(){
  var items = [
    {p:"je regarde", a:"je regardai"},
    {p:"nous regardons", a:"nous regardâmes"},
    {p:"vous remplissez", a:"vous remplîtes"},
    {p:"ils finissent", a:"ils finirent"},
    {p:"je voyage", a:"je voyageai"},
    {p:"il place", a:"il plaça"},
    {p:"nous faisons", a:"nous fîmes"},
    {p:"il va", a:"il alla"},
    {p:"ils vont", a:"ils allèrent"},
    {p:"je joue", a:"je jouai"},
    {p:"nous jouons", a:"nous jouâmes"},
    {p:"vous choisissez", a:"vous choisîtes"},
    {p:"ils grandissent", a:"ils grandirent"},
    {p:"je pense", a:"je pensai"},
    {p:"il chante", a:"il chanta"},
    {p:"nous dansons", a:"nous dansâmes"},
    {p:"vous saisissez", a:"vous saisîtes"}
  ];
  var pick = shuffle(items).slice(0,8);
  return pick.map(function(it){
    return {
      kind:"text",
      prompt: it.p,
      instruction:"Écris ce verbe au passé simple :",
      answer: it.a,
      accentTip: /[âî]/.test(it.a) ? "Pense au petit chapeau (^) : il n'apparaît que sur nous et vous !" : null
    };
  });
}

  var items = [

    {inf:"être", s:"il fut", p:"ils furent"},

/* ---- Module 5 : aire et périmètre ---- */
function gridSvg(cols, rows){
  var cell = 26, margin = 6;
  var w = cols*cell + margin*2, h = rows*cell + margin*2;
  var s = '<svg viewBox="0 0 '+w+' '+h+'">';
  s += '<rect x="'+margin+'" y="'+margin+'" width="'+(cols*cell)+'" height="'+(rows*cell)+'" style="fill:#eef2ff;stroke:#2b41c9;stroke-width:3"/>';
  for(var i=1;i<cols;i++){
    var x = margin+i*cell;
    s += '<line x1="'+x+'" y1="'+margin+'" x2="'+x+'" y2="'+(margin+rows*cell)+'" style="stroke:#2b41c9;stroke-width:1.5"/>';
  }
  for(var j=1;j<rows;j++){
    var y = margin+j*cell;
    s += '<line x1="'+margin+'" y1="'+y+'" x2="'+(margin+cols*cell)+'" y2="'+y+'" style="stroke:#2b41c9;stroke-width:1.5"/>';
  }
  s += '</svg>';
  return s;
}

function countCells(matrix){
  var n = 0;
  matrix.forEach(function(row){ row.forEach(function(v){ if(v) n++; }); });
  return n;
}

function shapeGridSvg(matrix){
  var cell = 26, margin = 6;
  var rows = matrix.length, cols = matrix[0].length;
  var w = cols*cell + margin*2, h = rows*cell + margin*2;
  var s = '<svg viewBox="0 0 '+w+' '+h+'">';
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      if(matrix[r][c]){
        var x = margin+c*cell, y = margin+r*cell;
        s += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" style="fill:#eef2ff;stroke:#2b41c9;stroke-width:1.5"/>';
      }
    }
  }
  s += '</svg>';
  return s;
}

/* =========================================================
   ÉTAT / PERSISTANCE
   ========================================================= */
var STORAGE_KEY = "shamsProgress_v1";

function defaultState(){
  var modules = {};
  MODULES.forEach(function(m){
    modules[m.id] = { history:[], totalPoints:0, lastPlayed:null, timesPlayed:0 };
  });
  return {
    modules: modules,
    streakDays: 0,
    lastPlayedDate: null,
    totalPoints: 0,
    soundEnabled: true,
    badgesUnlocked: []
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var def = defaultState();
    parsed.modules = parsed.modules || {};
    MODULES.forEach(function(m){
      if(!parsed.modules[m.id]) parsed.modules[m.id] = def.modules[m.id];
    });
    if(typeof parsed.streakDays !== "number") parsed.streakDays = 0;
    if(typeof parsed.totalPoints !== "number") parsed.totalPoints = 0;
    if(typeof parsed.soundEnabled !== "boolean") parsed.soundEnabled = true;
    if(!Array.isArray(parsed.badgesUnlocked)) parsed.badgesUnlocked = [];
    return parsed;
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* stockage indisponible (ex : fichier ouvert directement dans Safari) : on continue sans bloquer la séance */ }
}

var state = loadState();

var BADGES = [
  {threshold:50, name:"Étoile filante", emoji:"🌠"},
  {threshold:150, name:"Sérieux comme un chef", emoji:"👑"},
  {threshold:300, name:"Champion en herbe", emoji:"🏆"},
  {threshold:600, name:"Maître Shams", emoji:"🥇"}
];

function moduleAvg(modState){
  if(!modState.history.length) return null;
  var sum = modState.history.reduce(function(a,b){return a+b;},0);
  return sum / modState.history.length;
}

function moduleLevel(modState){
  var avg = moduleAvg(modState);
  if(avg === null) return "nouveau";
  if(avg < 0.5) return "fragile";
  if(avg < 0.8) return "presque";
  return "acquis";
}

var LEVEL_LABEL = { nouveau:"À découvrir", fragile:"Fragile", presque:"Presque !", acquis:"Acquis" };

function pickDailyChallenge(){
  var best = null, bestScore = 2;
  MODULES.forEach(function(m){
    var avg = moduleAvg(state.modules[m.id]);
    var score = (avg === null) ? -1 : avg;
    if(score < bestScore){ bestScore = score; best = m; }
  });
  return best || MODULES[0];
}

function todayISO(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysBetween(iso1, iso2){
  var d1 = new Date(iso1+"T00:00:00");
  var d2 = new Date(iso2+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}

function registerSessionCompletion(moduleId, scoreFraction){
  var ms = state.modules[moduleId];
  ms.history.push(scoreFraction);
  if(ms.history.length > 5) ms.history.shift();
  ms.timesPlayed += 1;
  ms.lastPlayed = todayISO();

  var today = todayISO();
  if(state.lastPlayedDate === null){
    state.streakDays = 1;
  } else if(state.lastPlayedDate !== today){
    var diff = daysBetween(state.lastPlayedDate, today);
    if(diff === 1) state.streakDays += 1;
    else if(diff > 1) state.streakDays = 1;
  }
  state.lastPlayedDate = today;
  saveState();
}

function addPoints(n){
  state.totalPoints += n;
  saveState();
}

function checkNewBadges(){
  var newly = [];
  BADGES.forEach(function(b){
    if(state.totalPoints >= b.threshold && state.badgesUnlocked.indexOf(b.name) === -1){
      state.badgesUnlocked.push(b.name);
      newly.push(b);
    }
  });
  if(newly.length) saveState();
  return newly;
}

/* =========================================================
   AUDIO — bip de réussite (Web Audio API)
   ========================================================= */
var audioCtx = null;
function playSuccessBeep(){
  if(!state.soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.36);
  }catch(e){ /* audio non disponible, on ignore */ }
}

var CONFETTI_COLORS = ["#3d5cff","#ff9f43","#2fb380","#ffd166","#8a90ff"];
function launchConfetti(big){
  var layer = document.getElementById("confetti-layer");
  var count = big ? 34 : 16;
  for(var i=0;i<count;i++){
    var el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.animationDuration = (1.6 + Math.random()*1.2)+"s";
    el.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    layer.appendChild(el);
    (function(node){
      setTimeout(function(){ node.remove(); }, 3000);
    })(el);
  }
}

/* =========================================================
   NORMALISATION DES RÉPONSES
   ========================================================= */
function stripAccents(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function normText(s){
  return stripAccents(String(s||"")).toLowerCase().trim().replace(/\s+/g," ").replace(/[!.,;]/g,"");
}
function normCalc(s){
  return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/²/g,"2").replace(/,/g,".");
}
function normNumber(s){
  return String(s||"").replace(/[^\d\-]/g,"");
}

var view = "home";

  view = v;
  render();
  var main = app.querySelector("h1, h2, .prompt");
  if(main) main.focus && main.focus();
  window.scrollTo(0,0);
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

function topnavHtml(){
  return '<div class="topnav">'+
    '<div class="brand">✨ Les défis de Shams</div>'+
    '<div class="navbtns">'+
      '<button data-action="nav" data-view="home" aria-current="'+(view==="home")+'">Accueil</button>'+
      '<button data-action="nav" data-view="progress" aria-current="'+(view==="progress")+'">Suivi</button>'+
      '<button data-action="nav" data-view="settings" aria-current="'+(view==="settings")+'">Réglages</button>'+
    '</div></div>';
}

function render(){
  var html = topnavHtml();
  if(view === "home") html += renderHome();
  else if(view === "intro") html += renderIntro();
  else if(view === "quiz") html += renderQuiz();
  else if(view === "result") html += renderResult();
  else if(view === "progress") html += renderProgress();
  else if(view === "settings") html += renderSettings();
  app.innerHTML = html;
  wireEvents();
}

    '<div class="qcounter">'+m.emoji+' '+esc(m.title)+' — Question '+(quiz.index+1)+' / '+quiz.questions.length+'</div>'+

  if(q.instruction) h += '<div class="sub-prompt">'+esc(q.instruction)+'</div>';

    h += '<div class="btn-row"><button class="btn btn-primary" data-action="next-question">Suivant</button></div>';

      '<div><label for="ans2">'+esc(q.labels[1])+'</label><input class="answer-input" type="text" id="ans2"></div>'+
    '</div>';

    h += '<div class="frame-row">'+
      '<input class="answer-input" type="text" inputmode="numeric" id="ans1" aria-label="Borne inférieure" style="width:120px">'+
      '<span>&lt;</span><span>'+esc(q.prompt)+'</span><span>&lt;</span>'+
      '<input class="answer-input" type="text" inputmode="numeric" id="ans2" aria-label="Borne supérieure" style="width:120px">'+
    '</div>';
  } else if(q.kind === "calc"){
    h += '<input class="answer-input" type="text" id="ans" aria-label="Ta réponse">';
  } else if(q.kind === "choice"){
    h += '<div class="choices" role="group" aria-label="Choix de réponse">';
    q.options.forEach(function(opt,i){
      h += '<button type="button" class="choice-btn" data-action="pick-choice" data-value="'+esc(opt)+'" aria-pressed="false">'+esc(opt)+'</button>';
    });
    h += '</div><input type="hidden" id="ans">';
  } else if(q.kind === "rank"){
    h += '<div class="rank-selected" id="rank-selected" aria-live="polite"></div>';
    h += '<div class="rank-pool" id="rank-pool">';
    q.options.forEach(function(opt){
      h += '<button type="button" class="rank-chip" data-action="pick-rank" data-value="'+esc(opt)+'">'+esc(opt)+'</button>';
    });
    h += '</div>';
  }

  var showValidate = (q.kind === "text" || q.kind === "text2" || q.kind === "frame2" || q.kind === "calc");
  h += '<div class="btn-row">';
  if(showValidate){
    h += '<button type="submit" class="btn btn-primary" id="validate-btn">Valider</button>';
  }
  h += '</div></form>';

  h += '<div class="feedback" id="feedback" aria-live="polite"></div>';
  h += '<div class="btn-row" id="next-row" style="display:none;">'+
    '<button class="btn btn-primary" data-action="next-question">Suivant</button>'+
  '</div>';
  h += '</div>';
  return h;
}

function checkAnswer(q, userVals){
  if(q.kind === "text"){
    var okLoose = normText(userVals[0]) === normText(q.answer);
    var okStrict = userVals[0].trim() === q.answer;
    return { correct: okLoose, tip: (okLoose && !okStrict && q.accentTip) ? q.accentTip : null };
  }
  if(q.kind === "text2"){
    var ok1 = normText(userVals[0]) === normText(q.answer[0]);
    var ok2 = normText(userVals[1]) === normText(q.answer[1]);
    return { correct: ok1 && ok2 };
  }
  if(q.kind === "frame2"){
    var n1 = parseInt(normNumber(userVals[0]),10);
    var n2 = parseInt(normNumber(userVals[1]),10);
    return { correct: n1 === q.answer[0] && n2 === q.answer[1] };
  }
  if(q.kind === "calc"){
    return { correct: normCalc(userVals[0]) === normCalc(q.answer) };
  }
  if(q.kind === "choice"){
    return { correct: userVals[0] === q.answer };
  }
  if(q.kind === "rank"){
    var sel = quiz.rankSelection || [];
    if(sel.length !== q.answer.length) return { correct:false };
    for(var i=0;i<sel.length;i++){ if(sel[i] !== q.answer[i]) return { correct:false }; }
    return { correct:true };
  }
  return { correct:false };
}

function formatAnswerForDisplay(q){
  if(q.kind === "text") return q.answer;
  if(q.kind === "text2") return q.labels[0]+" "+q.answer[0] + " / " + q.labels[1]+" "+q.answer[1];
  if(q.kind === "frame2") return q.answer[0] + " < ... < " + q.answer[1];
  if(q.kind === "calc") return q.answer.replace(/2$/,"²").replace(/(\d+)(hm|mm|cm|m|km)/,"$1 $2");
  if(q.kind === "choice") return (q.name ? q.name.charAt(0).toUpperCase()+q.name.slice(1)+" : " : "") + q.answer;
  if(q.kind === "rank") return q.answer.join(" < ");
  return "";
}

function submitCurrentAnswer(){
  var q = quiz.questions[quiz.index];
  var vals = [];
  if(q.kind === "text" || q.kind === "calc"){
    vals = [document.getElementById("ans").value];
  } else if(q.kind === "text2"){
    vals = [document.getElementById("ans1").value, document.getElementById("ans2").value];
  } else if(q.kind === "frame2"){
    vals = [document.getElementById("ans1").value, document.getElementById("ans2").value];
  } else if(q.kind === "choice"){
    vals = [document.getElementById("ans").value];
    if(!vals[0]){
      showFeedbackTransient("Choisis une réponse avant de valider !");
      return;
    }
  }
  handleResult(q, checkAnswer(q, vals));
}

function showFeedbackTransient(msg){
  var fb = document.getElementById("feedback");
  fb.className = "feedback show retry";
  fb.textContent = msg;
}

function handleResult(q, result){
  quiz.attempts = (quiz.attempts||0) + 1;
  var fb = document.getElementById("feedback");
  var nextRow = document.getElementById("next-row");
  var form = document.getElementById("quiz-form");

  if(result.correct){
    finalizeQuestion(true);
    fb.className = "feedback show ok";
    fb.innerHTML = "Bravo, c'est exact ! 🎉" + (result.tip ? '<div class="tip">'+esc(result.tip)+'</div>' : "");
    playSuccessBeep();
    disableForm(form);
    nextRow.style.display = "flex";
    quiz.answered[quiz.index] = { cls:"ok", html: fb.innerHTML };
  } else if(quiz.attempts < 2){
    fb.className = "feedback show retry";
    fb.textContent = "Presque ! Regarde bien et réessaie 💪";
  } else {
    finalizeQuestion(false);
    fb.className = "feedback show reveal";
    var extra = "";
    if(q.solid){
      extra = '<button type="button" class="euler-btn" data-action="euler" data-faces="'+q.solid.faces+'" data-sommets="'+q.solid.sommets+'" data-aretes="'+q.solid.aretes+'" data-name="'+esc(q.solid.name)+'">🔎 Vérifier avec la formule secrète</button><div class="euler-info" id="euler-info" style="display:none;"></div>';
    }
    fb.innerHTML = "Pas grave, on retient : <b>"+esc(formatAnswerForDisplay(q))+"</b>. On continue !"+extra;
    disableForm(form);
    nextRow.style.display = "flex";
    quiz.answered[quiz.index] = { cls:"reveal", html: fb.innerHTML };
  }
}

function disableForm(form){
  if(!form) return;
  var els = form.querySelectorAll("input, button");
  els.forEach(function(el){ el.disabled = true; });
  var choiceBtns = document.querySelectorAll(".choice-btn, .rank-chip");
  choiceBtns.forEach(function(el){ el.disabled = true; });
}

function finalizeQuestion(correct){
  if(correct){
    quiz.streak = (quiz.streak||0) + 1;
    quiz.correctCount = (quiz.correctCount||0) + 1;
    quiz.pointsEarned = (quiz.pointsEarned||0) + 10;
    if(quiz.streak % 2 === 0){
      quiz.pointsEarned += 5;
      quiz.starsEarned = (quiz.starsEarned||0) + 1;
    }
  } else {
    quiz.streak = 0;
  }
}

/* ---------- RESULT ---------- */
function renderResult(){
  var m = MODULES.find(function(x){return x.id===quiz.moduleId;});
  var total = quiz.questions.length;
  var correct = quiz.correctCount || 0;
  var fraction = correct/total;
  var newBadges = quiz.newBadges || [];
  var h = '<div class="card">'+
    '<h1 tabindex="-1">'+m.emoji+' Séance terminée !</h1>'+
    '<div class="result-score">'+correct+' / '+total+'</div>'+
    '<div class="result-stars">'+ "⭐".repeat(quiz.starsEarned||0) +'</div>'+
    '<div class="result-line">+'+(quiz.pointsEarned||0)+' points gagnés — total : '+state.totalPoints+' points</div>';

  if(newBadges.length){
    newBadges.forEach(function(b){
      h += '<div class="badge-banner">Nouveau badge débloqué : '+b.emoji+' '+esc(b.name)+' !</div>';
    });
  }

  h += '<div class="btn-row">'+
    '<button class="btn btn-primary" data-action="start-module" data-id="'+m.id+'">Rejouer ce module</button>'+
    '<button class="btn btn-ghost" data-action="nav" data-view="home">Retour à l\'accueil</button>'+
  '</div></div>';
  return h;
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  var h = '<div class="streak-banner">🔥 '+state.streakDays+' jour'+(state.streakDays>1?'s':'')+' d\'affilée</div>';
  h += '<div class="card"><h1 tabindex="-1">Mon suivi</h1>';
  h += '<table class="suivi"><thead><tr><th>Module</th><th>Progression</th><th>Niveau</th><th>Dernier score</th></tr></thead><tbody>';
  MODULES.forEach(function(m){
    var ms = state.modules[m.id];
    var avg = moduleAvg(ms);
    var lvl = moduleLevel(ms);
    var pct = avg === null ? 0 : Math.round(avg*100);
    var lastScore = ms.history.length ? Math.round(ms.history[ms.history.length-1]*100)+"%" : "—";
    h += '<tr><td>'+m.emoji+' '+esc(m.title)+'</td>'+
      '<td><div class="mini-bar-track"><div class="mini-bar-fill" style="width:'+pct+'%"></div></div></td>'+
      '<td><span class="pastille '+lvl+'">'+LEVEL_LABEL[lvl]+'</span></td>'+
      '<td>'+lastScore+'</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="result-line" style="margin-top:14px;">Total de points : '+state.totalPoints+'</div>';
  if(state.badgesUnlocked.length){
    h += '<div class="result-line">Badges : '+state.badgesUnlocked.map(function(n){
      var b = BADGES.find(function(x){return x.name===n;});
      return b ? b.emoji+" "+esc(b.name) : esc(n);
    }).join(" · ")+'</div>';
  }
  h += '</div>';
  return h;
}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  return '<div class="card"><h1 tabindex="-1">Réglages</h1>'+
    '<div class="toggle-row">'+
      '<label for="sound-toggle" style="font-weight:700;">Son (bip de réussite)</label>'+
      '<span class="switch"><input type="checkbox" id="sound-toggle" '+(state.soundEnabled?'checked':'')+'><span class="track"></span><span class="thumb"></span></span>'+
    '</div>'+
    '<hr style="border:none;border-top:1px solid #eef0f8;margin:14px 0;">'+
    '<p style="color:var(--ink-soft);">Réinitialiser efface tous les scores, séries et badges enregistrés sur cet appareil.</p>'+
    '<button class="btn btn-danger" data-action="reset-progress">Réinitialiser ma progression</button>'+
  '</div>';
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */
function wireEvents(){
  app.onclick = function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");

    if(action === "nav"){
      go(btn.getAttribute("data-view"));
    } else if(action === "open-module"){
      currentModuleId = btn.getAttribute("data-id");
      go("intro");
    } else if(action === "start-module"){
      currentModuleId = btn.getAttribute("data-id");
      startQuiz(currentModuleId);
    } else if(action === "begin-quiz"){
      startQuiz(btn.getAttribute("data-id"));
    } else if(action === "pick-choice"){
      document.getElementById("ans").value = btn.getAttribute("data-value");
      document.querySelectorAll(".choice-btn").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      submitCurrentAnswer();
    } else if(action === "pick-rank"){
      quiz.rankSelection = quiz.rankSelection || [];
      if(quiz.rankSelection.indexOf(btn.getAttribute("data-value")) !== -1) return;
      quiz.rankSelection.push(btn.getAttribute("data-value"));
      btn.disabled = true;
      updateRankSelectedUI();
      var q = quiz.questions[quiz.index];
      if(quiz.rankSelection.length === q.answer.length){
        submitCurrentAnswer();
      }
    } else if(action === "next-question"){
      advanceQuestion();
    } else if(action === "prev-question"){
      if(quiz.index > 0) goToQuestion(quiz.index - 1);
    } else if(action === "euler"){
      var info = document.getElementById("euler-info");
      var f = parseInt(btn.getAttribute("data-faces"),10);
      var s = parseInt(btn.getAttribute("data-sommets"),10);
      var a = parseInt(btn.getAttribute("data-aretes"),10);
      var name = btn.getAttribute("data-name");
      info.style.display = "block";
      info.innerHTML = "Pour "+esc(name)+" : "+s+" sommets + "+f+" faces = "+(s+f)+", et "+a+" arêtes + 2 = "+(a+2)+". Ça correspond ! ✅";
    } else if(action === "reset-progress"){
      if(window.confirm("Es-tu sûr de vouloir tout réinitialiser ? Cette action efface les scores, séries et badges.")){
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* stockage indisponible, on repart quand même sur un état neuf */ }
        state = defaultState();
        go("home");
      }
    }
  };

  var form = document.getElementById("quiz-form");
  if(form){
    form.onsubmit = function(e){
      e.preventDefault();
      submitCurrentAnswer();
    };
  }

  var soundToggle = document.getElementById("sound-toggle");
  if(soundToggle){
    soundToggle.onchange = function(){
      state.soundEnabled = soundToggle.checked;
      saveState();
    };
  }

  if(view === "quiz"){
    var firstInput = app.querySelector(".answer-input, .choice-btn, .rank-chip");
    if(firstInput) firstInput.focus();
    updateRankSelectedUI();
  }
}

function updateRankSelectedUI(){
  var container = document.getElementById("rank-selected");
  if(!container) return;
  var sel = quiz.rankSelection || [];
  container.innerHTML = sel.length ? sel.map(function(v){ return "<span>"+esc(v)+"</span>"; }).join("") : '<span style="background:transparent;color:var(--ink-soft);font-weight:500;">Clique les nombres ci-dessous, du plus petit au plus grand</span>';
}

function startQuiz(moduleId){
  currentModuleId = moduleId;
  quiz = {
    moduleId: moduleId,
    questions: BUILDERS[moduleId](),
    index: 0,
    attempts: 0,
    correctCount: 0,
    streak: 0,
    pointsEarned: 0,
    starsEarned: 0,
    rankSelection: [],
    answered: []
  };
  go("quiz");
}

function goToQuestion(index){
  quiz.index = index;
  quiz.attempts = 0;
  quiz.rankSelection = [];
  render();
  if(view === "quiz"){
    var firstInput = app.querySelector(".answer-input, .choice-btn, .rank-chip, [data-action='next-question']");
    if(firstInput) firstInput.focus();
  }
}

function advanceQuestion(){
  if(quiz.index >= quiz.questions.length - 1){
    finishQuiz();
  } else {
    goToQuestion(quiz.index + 1);
  }
}

function finishQuiz(){
  var fraction = quiz.correctCount / quiz.questions.length;
  try{
    registerSessionCompletion(quiz.moduleId, fraction);
    addPoints(quiz.pointsEarned);
    quiz.newBadges = checkNewBadges();
  }catch(e){
    quiz.newBadges = quiz.newBadges || [];
  }
  go("result");
  launchConfetti(fraction >= 0.8);
}

/* =========================================================
   DÉMARRAGE
   ========================================================= */
render();

})();
</script>
</body>
</html>
